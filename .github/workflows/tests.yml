# Offline test suite on the supported core Pythons. Only pytest is installed: the
# tests make no model call and need no anthropic SDK, benchmark checkout, Docker
# or cloud credentials, and this job keeps it that way.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q
